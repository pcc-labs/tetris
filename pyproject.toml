[project]
name = "tetris-agent"
version = "0.1.0"
description = "Self-healing Game Boy Tetris agent: fitness-driven genome tuning with LLM escalation"
requires-python = ">=3.11"
dependencies = [
    "pyboy>=2.4",
    "numpy>=1.26",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "websockets>=17.0.1",
    "pillow>=12.3.0",
    "anthropic>=0.120.2",
]

[project.scripts]
tetris-agent = "tetris_agent.cli:agent_main"
tetris-healer = "tetris_agent.cli:healer_main"
tetris-discovery = "tetris_agent.cli:discovery_main"
tetris-viewer = "tetris_agent.viewer:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tetris_agent"]

[tool.pytest.ini_options]
addopts = "-m 'not rom'"
markers = ["rom: boots PyBoy with the real ROM (slow)"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
